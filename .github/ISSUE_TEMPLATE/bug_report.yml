name: Bug Report
description: Report a reproducible problem or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Student Transcribe! Please fill out the details below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong? What did you see?
      placeholder: Clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can someone else trigger this bug?
      placeholder: |
        1. Open Class Slides tab
        2. Zoom in to 200%
        3. Scroll with touchpad...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Operating system and version
      placeholder: Windows 11 23H2 / Student Transcribe v1.4.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Application Logs (Optional)
      description: Paste any error messages from Settings → Diagnostics & Application Logs → View Application Logs
      render: shell
